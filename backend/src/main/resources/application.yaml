  jwt:
    secret: MuraliBlogSecretKey2026HS512ShouldBeVeryLongAndSecureChangeInProd
    expiration-ms: 86400000

# Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true